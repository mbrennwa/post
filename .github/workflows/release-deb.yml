# Build a .deb on version tags and attach it to the matching GitHub Release.
# Tag must match pyproject.toml (e.g. version 0.1.0 → tag v0.1.0).

name: Release DEB

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper devscripts fakeroot build-essential \
            python3 python3-venv python3-pip
          sudo apt-get satisfy -y "debhelper-compat (= 13)" || true

      - name: Build .deb package
        env:
          DEBEMAIL: mbrennwa@gmail.com
          DEBFULLNAME: Matthias Brennwald
        run: |
          set -euxo pipefail
          chmod +x tools/build-deb.sh debian/rules
          ./tools/build-deb.sh
          test -n "$(find dist -maxdepth 1 -name 'post_*_all.deb' -print -quit)"

      - name: Set pre-release flag for .dev versions
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if echo "$VERSION" | grep -qE '\.dev[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with .deb
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/post_*_all.deb

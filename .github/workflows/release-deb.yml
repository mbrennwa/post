# Build .deb and .rpm on version tags and attach them to the matching GitHub Release.
# Tag must match pyproject.toml (e.g. version 1.0.0.dev2 → tag v1.0.0.dev2).

name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper devscripts fakeroot build-essential \
            python3 python3-venv python3-pip
          sudo apt-get satisfy -y "debhelper-compat (= 13)" || true

      - name: Build .deb package
        env:
          DEBEMAIL: mbrennwa@gmail.com
          DEBFULLNAME: Matthias Brennwald
        run: |
          set -euxo pipefail
          chmod +x tools/build-deb.sh debian/rules
          ./tools/build-deb.sh
          test -n "$(find dist -maxdepth 1 -name 'post_*_all.deb' -print -quit)"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/post_*_all.deb

  build-rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build python3 python3-pip python3-setuptools \
            git tar binutils

      - name: Build .rpm package
        run: |
          set -euxo pipefail
          chmod +x tools/build-rpm.sh
          ./tools/build-rpm.sh
          test -n "$(find dist -maxdepth 1 -name 'post-*-1.noarch.rpm' -print -quit)"

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/post-*-1.noarch.rpm

  release:
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-24.04
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist

      - name: Download .rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: rpm
          path: dist

      - name: Set pre-release flag for .dev versions
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if echo "$VERSION" | grep -qE '\.dev[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          ls -la dist/

      - name: Publish GitHub Release with packages
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/post_*_all.deb
            dist/post-*-1.noarch.rpm

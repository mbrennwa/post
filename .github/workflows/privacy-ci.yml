# Continuous privacy gate for repo tree + commit messages (#274).

name: Privacy CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit repo tree
        run: SCOPE=tree SKIP_HISTORY=1 ./scripts/audit-issue-privacy.sh

      - name: Audit commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Fixed PR base SHA (not a live origin/main tip) so a merge that lands
          # while this job runs cannot widen origin/main...HEAD into history.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if [ -z "${BASE_SHA}" ]; then
              echo "error: pull_request base sha missing" >&2
              exit 1
            fi
            git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null
            RANGE="${BASE_SHA}...HEAD"
          else
            # Push to main: scan commits in this push when before is a real SHA.
            if [ -n "${BEFORE}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] \
              && git rev-parse --verify "${BEFORE}" >/dev/null 2>&1; then
              RANGE="${BEFORE}...${SHA}"
            else
              RANGE="HEAD~20..HEAD"
            fi
          fi
          echo "COMMIT_RANGE=${RANGE}"
          SCOPE=commits COMMIT_RANGE="${RANGE}" ./scripts/audit-issue-privacy.sh

name: Test

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    # Post needs Evolution Data Server 3.62 or newer (#535). ubuntu-latest and
    # Debian testing ship 3.56 and cannot exercise the Camel calls Post makes,
    # so the suite runs on Debian unstable, which has 3.62.
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    steps:
      - name: Install bootstrap packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: ./scripts/install-deps.sh xvfb

      - name: Run checks
        env:
          # WebKitGTK sandbox needs unprivileged user namespaces; GitHub-hosted
          # runners often deny bwrap uid maps (AppArmor), which aborts WebView tests.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          GTK_A11Y: none
        run: |
          python3 -m venv .venv --system-site-packages
          xvfb-run -a ./scripts/check.sh

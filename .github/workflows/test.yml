name: Test

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: ./scripts/install-deps.sh xvfb

      - name: Run checks
        run: |
          python3 -m venv .venv --system-site-packages
          xvfb-run -a ./scripts/check.sh

name: Test

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: ./scripts/install-deps.sh xvfb

      - name: Run checks
        env:
          # WebKitGTK sandbox needs unprivileged user namespaces; GitHub-hosted
          # runners often deny bwrap uid maps (AppArmor), which aborts WebView tests.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          GTK_A11Y: none
        run: |
          python3 -m venv .venv --system-site-packages
          xvfb-run -a ./scripts/check.sh

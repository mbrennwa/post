[project]
name = "post"
version = "1.0.0a2"
description = "A simple GNOME mail client — GTK4 UI on Evolution Data Server"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "mbrennwa" }]

[project.optional-dependencies]
dev = ["reuse>=5"]

[project.scripts]
post = "post.main:main"
post-probe = "post.probe:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
post = ["icons/**/*.png", "icons/**/*.svg"]

[tool.deb]
# Debian/Ubuntu packages provided by the distro (not PyPI).
# Dev venv uses --system-site-packages (see run.sh); .deb postinst same pattern.
apt_depends = [
  "python3 (>= 3.10)",
  "python3-venv",
  "python3-gi",
  "gir1.2-gtk-4.0",
  "gir1.2-adw-1",
  "gir1.2-glib-2.0",
  "gir1.2-camel-1.2",
  "gir1.2-edataserver-1.2",
  "gir1.2-ecal-2.0",
  "gir1.2-webkit-6.0",
  "evolution-data-server",
  "evolution-ews",
  "librsvg2-bin",
  "desktop-file-utils",
]

[tool.rpm]
# Fedora packages provided by the distro (not PyPI).
# Target venv uses --system-site-packages (see rpm %post); same pattern as .deb.
dnf_requires = [
  "python3 >= 3.10",
  "python3-pip",
  "python3-gobject",
  "gtk4",
  "libadwaita",
  "glib2",
  "webkitgtk6.0",
  "evolution-data-server",
  "libecal2.0",
  "evolution-ews",
  "librsvg2-tools",
  "desktop-file-utils",
]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.mbrennwa.Post.desktop"]
"share/icons/hicolor/48x48/apps" = [
  "data/icons/hicolor/48x48/apps/io.github.mbrennwa.Post.png",
]
"share/icons/hicolor/96x96/apps" = [
  "data/icons/hicolor/96x96/apps/io.github.mbrennwa.Post.png",
]
"share/icons/hicolor/128x128/apps" = [
  "data/icons/hicolor/128x128/apps/io.github.mbrennwa.Post.png",
]
"share/icons/hicolor/192x192/apps" = [
  "data/icons/hicolor/192x192/apps/io.github.mbrennwa.Post.png",
]
"share/icons/hicolor/256x256/apps" = [
  "data/icons/hicolor/256x256/apps/io.github.mbrennwa.Post.png",
]

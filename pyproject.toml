[project]
name = "post"
version = "0.1.0"
description = "A simple GNOME mail client — GTK4 UI on Evolution Data Server"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "mbrennwa" }]

[project.scripts]
post = "post.main:main"
post-probe = "post.probe:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
post = ["icons/**/*.svg"]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.mbrennwa.Post.desktop"]
"share/icons/hicolor/scalable/apps" = [
  "data/icons/hicolor/scalable/apps/io.github.mbrennwa.Post.svg",
]
"share/icons/hicolor/scalable/actions" = [
  "data/icons/hicolor/scalable/actions/mail-archive-symbolic.svg",
]

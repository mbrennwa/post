[project]
name = "post"
version = "0.1.0"
description = "A simple GNOME mail client — GTK4 UI on Evolution Data Server"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "mbrennwa" }]

[project.optional-dependencies]
dev = ["reuse>=5"]

[project.scripts]
post = "post.main:main"
post-probe = "post.probe:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
post = ["icons/**/*.png", "icons/**/*.svg"]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.mbrennwa.Post.desktop"]
"share/icons/hicolor/48x48/apps" = [
  "data/icons/hicolor/48x48/apps/io.github.mbrennwa.Post.png",
]
"share/icons/hicolor/96x96/apps" = [
  "data/icons/hicolor/96x96/apps/io.github.mbrennwa.Post.png",
]
"share/icons/hicolor/128x128/apps" = [
  "data/icons/hicolor/128x128/apps/io.github.mbrennwa.Post.png",
]
"share/icons/hicolor/192x192/apps" = [
  "data/icons/hicolor/192x192/apps/io.github.mbrennwa.Post.png",
]
"share/icons/hicolor/256x256/apps" = [
  "data/icons/hicolor/256x256/apps/io.github.mbrennwa.Post.png",
]
"share/icons/hicolor/scalable/actions" = [
  "data/icons/hicolor/scalable/actions/mail-archive-symbolic.svg",
  "data/icons/hicolor/scalable/actions/mail-flag-symbolic.svg",
  "data/icons/hicolor/scalable/actions/mail-unflag-symbolic.svg",
]
